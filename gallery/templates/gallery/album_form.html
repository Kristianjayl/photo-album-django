{% extends 'gallery/base.html' %}
{% block title %}{% if object %}Edit Album{% else %}New Album{% endif %}{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
    <h2>{% if object %}Edit Album{% else %}Create New Album{% endif %}</h2>
    <div class="card">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <div style="display:flex; gap:10px; margin-top:1rem;">
                    <button type="submit" class="btn btn-primary">Save Album</button>
                    <a href="{% url 'album_list' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
