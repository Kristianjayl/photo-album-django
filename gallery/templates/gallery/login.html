{% extends 'gallery/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <div class="card-body">
            <h2 style="margin-top:0; color: var(--primary);">Login</h2>
            <form method="POST">
                {% csrf_token %}
                {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:0.5rem;">Login</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
