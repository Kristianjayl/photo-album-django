{% extends 'gallery/base.html' %}
{% block title %}Delete Photo{% endblock %}

{% block content %}
<div style="max-width:500px; margin:4rem auto; text-align:center;">
    <div class="card">
        <div class="card-body">
            <h2 style="color:#dc3545;">Delete "{{ object.title }}"?</h2>
            <img src="{{ object.image.url }}" style="width:100%; height:180px; object-fit:cover; border-radius:6px; margin-bottom:1rem;">
            <p style="color:#666;">This will permanently remove the photo from Cloudinary. This cannot be undone.</p>
            <form method="POST">
                {% csrf_token %}
                <div style="display:flex; gap:10px; justify-content:center;">
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'album_detail' object.album.pk %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
